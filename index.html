<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>货币战争工具</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>✦</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/landing.css">
</head>
<body>
  <canvas id="star-canvas"></canvas>

  <div class="landing">
    <!-- Lamp Theme Toggle -->
    <div id="lamp-toggle" aria-label="切换深色/浅色主题" title="拉一下切换主题">
      <div class="lamp-mount"></div>
      <div class="lamp-shade">
        <div class="lamp-bulb"></div>
      </div>
      <canvas id="lamp-cord-canvas"></canvas>
      <div class="lamp-pullball"></div>
    </div>

    <!-- Header -->
    <div class="header animate-slide-down">
      <div class="icon">✦</div>
      <h1>货币战争工具</h1>
      <p class="subtitle">
        基于《崩坏：星穹铁道》货币战争的模拟工具<br>
        交互式角色羁绊关系网络 &amp; 拖拽式队伍编排模拟 &amp; 其他图鉴查询
      </p>
    </div>

    <!-- Mode Cards -->
    <div class="cards">
      <a class="card animate-pop-up delay-1" href="app.html?mode=graph">
        <div class="card-icon-wrap">
          <span class="card-icon">🕸️</span>
        </div>
        <h2>角色星图</h2>
        <p>探索角色羁绊关系网络图，可视化展示角色之间的关联。</p>
        <div class="card-label">
          <span>角色星图</span>
          <span class="arrow">→</span>
        </div>
      </a>

      <a class="card animate-pop-up delay-2" href="app.html?mode=team">
        <div class="card-icon-wrap">
          <span class="card-icon">⚔️</span>
        </div>
        <h2>阵容摆放</h2>
        <p>拖拽式角色布阵工具，模拟战场环境，快速构建、调整并评估阵容配置。</p>
        <div class="card-label">
          <span>阵容摆放</span>
          <span class="arrow">→</span>
        </div>
      </a>

      <a class="card animate-pop-up delay-3" href="app.html?mode=others">
        <div class="card-icon-wrap">
          <span class="card-icon">📦</span>
        </div>
        <h2>图鉴一览</h2>
        <p>角色、羁绊、敌方势力、敌方词缀、投资环境与投资策略效果查询。</p>
        <div class="card-label">
          <span>图鉴一览</span>
          <span class="arrow">→</span>
        </div>
      </a>
    </div>

    <!-- Footer -->
    <div class="footer animate-pop-up delay-4">
      <p>使用 PC 端浏览器获得最佳体验</p>
      <div class="divider"></div>
      <div class="footer-links">
        <a class="footer-link" href="https://github.com/pointshine/HSR_CW_NetWork" target="_blank" rel="noopener">项目仓库</a>
        <a class="footer-link" href="https://bbs.mihoyo.com/sr/wiki/channel/map/209" target="_blank" rel="noopener">米游社Wiki</a>
        <a class="footer-link" href="https://wiki.biligame.com/sr/货币战争" target="_blank" rel="noopener">BWiki</a>
      </div>
      <div class="footer-links">
        <a class="footer-link" href="update.html" rel="noopener">货币战争更新日志</a>
      </div>
    </div>
  </div>

  <script src="script/landing.js"></script>
</body>
</html>
